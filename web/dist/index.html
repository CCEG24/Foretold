<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Foretold (web)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #16161c; }
    #app { display: grid; place-items: center; height: 100%; }
    /* Board is authored at 1680×900; keep that aspect while fitting the viewport. */
    #canvas { display: block; width: min(100vw, 177.78vh); aspect-ratio: 1680 / 900;
              touch-action: none; }
    #status { position: fixed; bottom: 12px; left: 12px; color: #69db7c;
              font: 13px/1.4 monospace; background: rgba(0,0,0,0.7);
              padding: 8px 12px; border-radius: 5px; white-space: pre-wrap; max-width: 90vw; }
    #status.err { color: #ff7b7b; }
    /* Covers the canvas until the renderer has warmed its textures, so the
       upload stall and the first blank frames happen out of sight. */
    #boot { position: fixed; inset: 0; z-index: 50; background: #16161c;
            display: grid; place-items: center; align-content: center; gap: 14px;
            text-align: center; transition: opacity 0.4s ease; }
    #boot .title { color: #eecc73; font: 400 34px/1 Papyrus, "Papyrus", fantasy;
                   letter-spacing: 0.14em; }
    #boot .line { color: #8c8f99; font: 13px/1.5 "Helvetica Neue", sans-serif;
                  letter-spacing: 0.06em; }
    #boot.gone { opacity: 0; pointer-events: none; }
    /* Proof of life while the wasm loads. Animates only transform/opacity, which
       browsers run on the compositor thread — so it keeps turning even while
       the main thread is pinned compiling or starting the 70 MB module, exactly
       when a static screen looks frozen. */
    #boot .ring { width: 38px; height: 38px; margin: 0 auto; border-radius: 50%;
                  border: 2px solid rgba(238,204,115,0.18); border-top-color: #eecc73;
                  animation: boot-spin 1.1s linear infinite; }
    #boot .line { animation: boot-breathe 2.4s ease-in-out infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @keyframes boot-breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    /* On-page log so console messages (incl. Swift stdout) are visible without DevTools. */
    /* Debug log panel — hidden unless the URL has ?log */
    #log { display: none; position: fixed; top: 0; right: 0; width: 42vw; height: 100vh; overflow: auto;
           margin: 0; padding: 8px; background: rgba(0,0,0,0.82); color: #b8c0cc;
           font: 11px/1.35 monospace; white-space: pre-wrap; z-index: 99; }
    #log.show { display: block; }
    /* Live frame stats (?log only) — WebMain rewrites it once a second instead
       of adding a console line every second. */
    #fps { display: none; position: fixed; top: 8px; left: 8px; z-index: 98;
           padding: 4px 8px; border-radius: 4px; background: rgba(0,0,0,0.7);
           color: #69db7c; font: 11px/1.35 monospace; white-space: pre;
           pointer-events: none; }
    #fps.show { display: block; }
    #log .e { color: #ff7b7b; }
    #log .drop { color: #ffd479; }
  </style>
</head>
<body>
  <div id="app">
    <!-- width/height are the pre-boot backing store only: WebMain resizes it to
         the CSS box × devicePixelRatio so the board renders at the display's
         real resolution. The CSS above owns the displayed size. -->
    <canvas id="canvas" width="1680" height="900" tabindex="0"></canvas>
  </div>
  <div id="boot">
    <div class="title">FORETOLD</div>
    <div class="ring"></div>
    <div class="line" id="boot-phase">consulting the bones…</div>
  </div>
  <div id="status">Loading…</div>
  <pre id="log"></pre>
  <div id="fps"></div>

  <script>
    // Mirror console.log/warn/error onto the page. Collapses repeated lines so a
    // spammy per-frame "dropped" message shows a count instead of flooding.
    (function () {
      // Only mirror console output to the page when explicitly requested (?log).
      if (!/[?&]log\b/.test(location.search)) return;
      const box = document.getElementById('log');
      box.classList.add('show');
      let lastText = null, lastEl = null, count = 1;
      function append(kind, args) {
        const text = args.map(a => {
          try { return typeof a === 'string' ? a : JSON.stringify(a); } catch { return String(a); }
        }).join(' ');
        if (text === lastText && lastEl) { count++; lastEl.textContent = `×${count}  ${text}`; return; }
        lastText = text; count = 1;
        const el = document.createElement('div');
        if (kind === 'error') el.className = 'e';
        else if (/drop|capacity|texture|exceed/i.test(text)) el.className = 'drop';
        el.textContent = text;
        box.appendChild(el); lastEl = el;
        box.scrollTop = box.scrollHeight;
      }
      for (const k of ['log', 'warn', 'error']) {
        const orig = console[k].bind(console);
        console[k] = (...a) => { append(k, a); orig(...a); };
      }
      window.addEventListener('error', e => append('error', ['window.onerror:', e.message]));
    })();
  </script>

  <script type="module">
    const status = document.getElementById('status');

    // Same switch as the console-mirror panel above: `?log` in the URL. One flag
    // for all debug surfaces, so there's only one thing to remember when you're
    // typing a URL by hand on someone else's machine.
    const DEBUG = /[?&]log\b/.test(location.search);

    // What a normal player sees. Anything more specific is diagnostics.
    const GENERIC_FAILURE = "Foretold couldn't start on this machine.";
    const NO_WEBGPU = 'Foretold needs WebGPU — try a recent Chrome or Edge.';

    // Progress chatter is debug-only — in production the status line stays
    // hidden and the canvas is the whole page.
    const note = (m) => { console.log(m); if (DEBUG) { status.textContent = String(m); status.className = ''; } };
    const hideStatus = () => { if (!DEBUG) status.style.display = 'none'; };

    // Failures always surface — a silently blank page is the one outcome worth
    // avoiding. Production gets the short human line; `detail` (internals, flag
    // lists, stack traces) is for `?log` only, but always goes to the console so
    // it's recoverable from a bug report.
    const fail = (short, detail) => {
      console.error(short + (detail ? '\n' + detail : ''));
      clearBoot();   // never leave an error hidden behind the loading cover
      status.style.display = '';
      status.className = 'err';
      status.textContent = DEBUG && detail
        ? short + '\n\n' + detail
        : short + '\n(add ?log to the URL for diagnostics)';
    };

    // WebMain.swift calls these once it knows the real outcome. setup() returns
    // as soon as it spawns its Task, so the page must NOT treat that as success —
    // adapter/canvas failures surface later, off the call stack we can catch.
    let settled = false;
    // The loading cover comes down on the first real frame — by which point
    // the textures are warm — and on failure too, so an error is never hidden
    // behind it.
    const boot = document.getElementById('boot');
    const clearBoot = () => {
      if (!boot || boot.classList.contains('gone')) return;
      boot.classList.add('gone');
      setTimeout(() => boot.remove(), 500);
    };

    window.foretoldReady = () => { settled = true; note('rendering'); hideStatus(); clearBoot(); };
    window.foretoldFailed = (m) => { settled = true; fail(GENERIC_FAILURE, 'Renderer failed: ' + m); };

    // Breadcrumbs from start(), so a boot that dies without reporting still says
    // where. A JavaScript exception thrown into WASM (a browser rejecting a
    // WebGPU configuration, say) unwinds the instance rather than returning an
    // error, which is how "neither callback fired" happens.
    // The loading line follows the boot along, so a long step reads as progress
    // rather than a hang. Keys are WebMain's stage() names; unknown ones leave
    // the line as it was.
    const bootPhase = document.getElementById('boot-phase');
    const setPhase = (text) => { if (bootPhase) bootPhase.textContent = text; };
    const PHASES = {
      'canvas':        'waking the renderer…',
      'renderer-init': 'waking the renderer…',
      'assets':        'gathering the pieces…',
      'scene':         'laying out the board…',
      'prewarm':       'warming the board…',
      'input':         'warming the board…',
      'first-frame':   'almost there…',
    };

    const stages = [];
    window.foretoldStage = (s) => {
      stages.push(String(s));
      note('stage: ' + s);
      if (PHASES[s]) setPhase(PHASES[s]);
    };
    const trail = () => stages.length
      ? 'Stages started: ' + stages.join(' → ') + ' (last one never finished)'
      : 'No stage was reached — setup() died before its first step.';

    // An uncaught exception or rejection IS the diagnosis in that case, and it
    // arrives on the event loop where nothing is watching for it. Only the first
    // one matters: a torn-down instance tends to throw again on every frame.
    const reportUncaught = (what, err) => {
      if (settled) return;
      settled = true;
      const detail = err && err.stack ? err.stack : String(err);
      fail(GENERIC_FAILURE, what + ' ' + detail + '\n\n' + trail() + '\n' + navigator.userAgent);
    };
    window.addEventListener('error', (e) => reportUncaught('Uncaught error:', e.error ?? e.message));
    window.addEventListener('unhandledrejection', (e) => reportUncaught('Unhandled rejection:', e.reason));

    const FLAG_HELP = [
      'Open chrome://gpu and read the WebGPU line for the blocklist reason, then try:',
      '  chrome://flags/#enable-unsafe-webgpu       (Unsafe WebGPU Support)',
      '  chrome://flags/#enable-unsafe-swiftshader  (software fallback — slow but renders)',
      '  chrome://flags/#ignore-gpu-blocklist       (Override software rendering list)',
      'Flag names move between Chrome versions; chrome://gpu is the source of truth.',
    ].join('\n');

    // `'gpu' in navigator` only proves the API exists, not that a GPU is usable.
    // On managed/school machines the API is typically present while
    // requestAdapter() resolves to null — policy-disabled acceleration, a
    // blocklisted driver, or an RDP/VM session with no real GPU.
    async function probeAdapter() {
      if (!('gpu' in navigator)) {
        return { ok: false, short: NO_WEBGPU,
                 detail: 'navigator.gpu is missing — this browser exposes no WebGPU at all.\n' + FLAG_HELP };
      }
      let adapter = null, threw = null;
      try { adapter = await navigator.gpu.requestAdapter(); } catch (e) { threw = e; }
      if (adapter) return { ok: true, adapter };

      // Does a software adapter exist? If so the flags are worth setting; if not,
      // nothing on this machine can render and that's worth saying plainly.
      let fallback = null;
      try { fallback = await navigator.gpu.requestAdapter({ forceFallbackAdapter: true }); } catch {}
      const head = threw
        ? 'requestAdapter() threw: ' + threw.message
        : 'requestAdapter() returned null — WebGPU exists but no GPU adapter is available.';
      const mid = fallback
        ? 'A software (fallback) adapter IS available, so the flags below should get it rendering.'
        : 'No adapter at all, not even software.';
      return { ok: false, short: NO_WEBGPU, detail: head + '\n' + mid + '\n' + FLAG_HELP };
    }

    const probe = await probeAdapter();
    if (!probe.ok) {
      fail(probe.short, probe.detail);
    } else {
      let desc = '';
      try {
        const info = probe.adapter.info
          ?? (probe.adapter.requestAdapterInfo ? await probe.adapter.requestAdapterInfo() : null);
        if (info) {
          const parts = [info.vendor, info.architecture, info.description].filter(Boolean).join(' ');
          if (parts) desc = ' (' + parts + ')';
        }
      } catch {}
      note('WebGPU adapter acquired' + desc + ' — starting…');
      // The download + compile is the longest silent stretch of the boot.
      setPhase('unrolling the scroll…');
      try {
        const { instantiate, MODULE_PATH } = await import('./instantiate.js');
        const { WASI, OpenFile, File, ConsoleStdout } = await import('./wasi-shim.js');

        const wasi = new WASI([], [], [
          new OpenFile(new File([])),
          ConsoleStdout.lineBuffered((m) => console.log('[swift]', m)),
          ConsoleStdout.lineBuffered((m) => console.warn('[swift]', m)),
        ]);

        const { instance } = await instantiate({
          module: fetch(new URL(MODULE_PATH, import.meta.url)),
          addToCoreImports(imports) { imports['wasi_snapshot_preview1'] = wasi.wasiImport; },
          instrumentInstance(inst) { wasi.initialize(inst); return inst; },
        });

        instance.exports.setup();
        // Deliberately NOT reporting success here — setup() only starts a Task.
        // foretoldReady/foretoldFailed above deliver the real verdict. The
        // watchdog covers the case where Swift reports neither.
        note('setup() called — waiting for first frame…');
        setTimeout(() => {
          if (!settled) {
            fail(GENERIC_FAILURE,
                 'setup() returned but no frame rendered within 10s and the renderer '
               + 'reported nothing — neither foretoldReady nor foretoldFailed fired.\n\n'
               + trail() + '\n' + navigator.userAgent);
          }
        }, 10000);
      } catch (e) {
        fail(GENERIC_FAILURE, e && e.stack ? e.stack : String(e));
      }
    }
  </script>
</body>
</html>
