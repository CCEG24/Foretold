name: Build and commit web output

on:
  # Manual runs let you validate a toolchain change on a branch before merging.
  workflow_dispatch:
  push:
    branches:
      - main
      # Toolchain-migration branches build (to prove the toolchain) but skip the
      # dist commit below — see the `if:` on the commit step.
      - "ci/**"
    paths:
      # Only rebuild when something that affects the WASM changes — NOT when the
      # job itself commits dist/ (avoids an infinite build loop).
      - "Foretold/**/*.swift"
      - "web/Sources/**"
      - "web/Web/**"
      - "web/Package.swift"
      - "web/build.sh"
      - "web-spike/fetch-deps.sh"
      - "web/patches/**"
      - ".github/workflows/build-web.yml"

concurrency:
  group: build-web
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Keep these in lockstep with web/build.sh + web-spike/README.md.
  #
  # Swift 6.4 is a RELEASE pin, not a snapshot. The deps (OpenSpriteKit et al.)
  # declare `swift-tools-version: 6.4`, which is exactly what this satisfies —
  # the old `main-snapshot-*` pin existed only because 6.4 hadn't shipped yet.
  # Snapshots also get pruned from swift.org, which would break CI with no code
  # change; a release tag can't disappear underneath us.
  SWIFT_VERSION: "6.4"
  # First-party wasm SDK from swift.org (swiftwasm/swift has no 6.4-RELEASE tag).
  WASM_SDK_URL: https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
  WASM_SDK_CHECKSUM: f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
  # SWIFT_WASM_SDK is NOT hardcoded — the bundle installs two SDKs (full +
  # Embedded Swift subset) that both match wasm32-unknown-wasip1, so the exact
  # id is resolved from `swift sdk list` below and exported to later steps.

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system libraries the Swift toolchain needs
        run: |
          set -eux
          sudo apt-get update
          # libcurl4-openssl-dev is the one swiftly flags; the rest are the
          # standard Swift-on-Linux runtime deps, added pre-emptively.
          sudo apt-get install -y \
            libcurl4-openssl-dev libxml2-dev libedit2 libpython3-dev \
            libncurses-dev libz3-dev binutils

      - name: Install swiftly + Swift toolchain
        run: |
          set -euxo pipefail
          curl -fsSL -O "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --assume-yes "$SWIFT_VERSION"
          swiftly use "$SWIFT_VERSION"
          # Expose the selected toolchain's swift shim to later steps.
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"

      - name: Verify Swift + install wasm SDK
        run: |
          set -euxo pipefail
          swift --version
          swift sdk install "$WASM_SDK_URL" --checksum "$WASM_SDK_CHECKSUM"
          swift sdk list
          # Pick the full-featured SDK, not the Embedded Swift one. Both match the
          # wasm32-unknown-wasip1 triple, so SwiftPM can't disambiguate on its own
          # and would warn + guess; we pass the exact id instead.
          # `|| true`: a no-match grep exits 1, which pipefail+set -e would turn
          # into an opaque step failure before the explicit check below runs.
          sdk_id="$(swift sdk list | grep -i wasm | grep -vi embedded | head -1 | tr -d '[:space:]' || true)"
          if [ -z "$sdk_id" ]; then
            echo "!! could not determine a non-embedded wasm SDK id from 'swift sdk list'"
            exit 1
          fi
          echo "Selected wasm SDK: $sdk_id"
          echo "SWIFT_WASM_SDK=$sdk_id" >> "$GITHUB_ENV"

      - name: Fetch + pin + patch OpenSpriteKit deps
        working-directory: web-spike
        run: |
          set -euxo pipefail
          chmod +x fetch-deps.sh
          ./fetch-deps.sh

      - name: Build web (WASM + JS bundle → web/dist)
        working-directory: web
        run: |
          set -euxo pipefail
          chmod +x build.sh
          ./build.sh
          ls -lh dist

      - name: Commit built dist if changed
        # Only main owns web/dist. Branch runs exist to prove the build, not to
        # publish — committing from a branch would push dist to the wrong ref.
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f web/dist   # dist is gitignored (dev machines don't commit it); CI owns it
          if git diff --cached --quiet; then
            echo "No dist changes to commit."
            exit 0
          fi
          git commit -m "ci: rebuild web/dist [skip ci]"
          git push
